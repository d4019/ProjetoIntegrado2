<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LOBAL TECH &#8226; Criar conta</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="prototipo.css" rel="stylesheet"></head><body>
<p class="no-operation">Prot&oacute;tipo est&aacute;tico: controles e formul&aacute;rios s&atilde;o apenas visuais; n&atilde;o salvam dados nem executam a&ccedil;&otilde;es.</p>
<section class="landing" id="cadastro">
        <header class="d-flex align-items-center justify-content-between gap-3">
            <div class="logo">LOBAL<span> TECH</span></div>
            <a class="btn btn-outline-light" href="inicio.html">Página inicial</a>
        </header>
        <div class="auth-box">
            <h1>Criar conta</h1>
            <p class="muted">Cadastre-se para acompanhar projetos.</p>
            <div class="mb-3">
                <label class="form-label" for="cadastro-nome">Nome completo</label>
                <input class="form-control" id="cadastro-nome" type="text">
            </div>
            <div class="mb-3">
                <label class="form-label" for="cadastro-email">E-mail</label>
                <input class="form-control" id="cadastro-email" type="email">
            </div>
            <div class="mb-3">
                <label class="form-label" for="cadastro-senha">Senha</label>
                <input class="form-control" id="cadastro-senha" type="password">
            </div>
            <div class="mb-3">
                <label class="form-label" for="cadastro-perfil">Perfil</label>
                <select class="form-select" id="cadastro-perfil">
                    <option>Cliente</option>
                    <option>Arquiteto</option>
                    <option>Técnico</option>
                </select>
            </div>
            <a class="btn btn-primary w-100" href="dashboard.html">Cadastrar</a>
            <p class="mt-3">
                <a href="login.html">Já tenho conta</a>
            </p>
        </div>
    </section>
</body>
</html>
