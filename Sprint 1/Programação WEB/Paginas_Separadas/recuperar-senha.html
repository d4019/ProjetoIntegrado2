<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LOBAL TECH &#8226; Recuperar senha</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="prototipo.css" rel="stylesheet"></head><body>
<p class="no-operation">Prot&oacute;tipo est&aacute;tico: controles e formul&aacute;rios s&atilde;o apenas visuais; n&atilde;o salvam dados nem executam a&ccedil;&otilde;es.</p>
<section class="landing" id="recuperar-senha">
        <header class="d-flex align-items-center justify-content-between gap-3">
            <div class="logo">LOBAL<span> TECH</span></div>
            <a class="btn btn-outline-light" href="inicio.html">Página inicial</a>
        </header>
        <div class="auth-box">
            <h1>Recuperar senha</h1>
            <p class="muted">Demonstração local: informe o e-mail cadastrado e uma nova senha. Não há envio de e-mail.</p>
            <div class="mb-3">
                <label class="form-label" for="recuperar-email">E-mail cadastrado</label>
                <input class="form-control" id="recuperar-email" type="email">
            </div>
            <div class="mb-3">
                <label class="form-label" for="recuperar-nova-senha">Nova senha</label>
                <input class="form-control" id="recuperar-nova-senha" type="password">
            </div>
            <a class="btn btn-primary" href="login.html">Atualizar senha</a>
        </div>
    </section>
</body></html>
