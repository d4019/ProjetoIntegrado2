
<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>LOBAL TECH • Plataforma de Automação</title>
        <style>
            :root {
                --navy: #101c32;
                --blue: #245cf5;
                --sky: #eaf0ff;
                --line: #e4eaf3;
                --bg: #f5f7fb;
                --muted: #65738a;
                --green: #14845c;
                --orange: #aa6519
            }

            * {
                box-sizing: border-box
            }

            body {
                margin: 0;
                background: var(--bg);
                font: 14px system-ui,-apple-system,Segoe UI,sans-serif;
                color: var(--navy)
            }

            button,input,select,textarea {
                font: inherit
            }

            button {
                cursor: pointer
            }

            button:disabled {
                opacity: .45
            }

            a {
                color: inherit
            }

            .shell {
                display: flex;
                min-height: 100vh
            }

            .sidebar {
                width: 242px;
                flex-shrink: 0;
                background: #101d34;
                color: #eaf0fc;
                padding: 24px 14px;
                position: sticky;
                top: 0;
                height: 100vh;
                overflow: auto
            }

            .logo {
                font-size: 23px;
                font-weight: 900;
                letter-spacing: -1px;
                margin: 4px 10px 25px
            }

            .logo span {
                color: #79a9ff
            }

            .sidebtn {
                width: 100%;
                background: transparent;
                border: 0;
                text-align: left;
                color: #c5d2e7;
                padding: 12px 13px;
                border-radius: 10px;
                margin: 2px 0;
                display: flex;
                gap: 12px;
                align-items: center
            }

            .sidebtn.active,.sidebtn:hover {
                background: #243b62;
                color: white
            }

            .sidebottom {
                border-top: 1px solid #32435f;
                margin-top: 24px;
                padding-top: 12px
            }

            .main {
                flex: 1;
                min-width: 0
            }

            .top {
                background: #fff;
                border-bottom: 1px solid var(--line);
                padding: 16px 28px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                position: sticky;
                top: 0;
                z-index: 5
            }

            .content {
                max-width: 1280px;
                padding: 30px;
                margin: auto
            }

            .muted {
                color: var(--muted)
            }

            h1 {
                font-size: 29px;
                letter-spacing: -.7px;
                margin: 6px 0
            }

            h2 {
                font-size: 20px;
                margin: 0 0 16px
            }

            h3 {
                font-size: 16px;
                margin: 4px 0 12px
            }

            .sub {
                margin: 0 0 25px;
                color: var(--muted)
            }

            .card {
                background: white;
                border: 1px solid var(--line);
                border-radius: 17px;
                padding: 22px;
                box-shadow: 0 5px 20px #152b4906;
                margin-bottom: 17px
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(3,minmax(0,1fr));
                gap: 16px
            }

            .grid.two {
                grid-template-columns: repeat(2,minmax(0,1fr))
            }

            .btn {
                background: #fff;
                border: 1px solid #d7e0ec;
                border-radius: 10px;
                padding: 10px 14px;
                color: var(--navy);
                font-weight: 650
            }

            .btn:hover {
                border-color: var(--blue)
            }

            .btn.primary {
                background: var(--blue);
                color: #fff;
                border-color: var(--blue)
            }

            .btn.danger {
                color: #a22d3b
            }

            .btn.small {
                padding: 6px 10px;
                font-size: 12px
            }

            .row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                flex-wrap: wrap
            }

            .stack {
                display: flex;
                gap: 9px;
                flex-wrap: wrap;
                align-items: center
            }

            .pill {
                background: var(--sky);
                color: #2154bb;
                border-radius: 30px;
                padding: 5px 10px;
                font-size: 12px;
                font-weight: 700
            }

            .pill.green {
                background: #e5f7ef;
                color: #08754b
            }

            .pill.orange {
                background: #fff1dc;
                color: #955814
            }

            .pill.red {
                background: #fff0f1;
                color: #a53643
            }

            input,select,textarea {
                border: 1px solid #d9e1ed;
                border-radius: 10px;
                background: #fff;
                padding: 11px 12px;
                max-width: 100%;
                width: 100%;
                outline: none
            }

            textarea {
                min-height: 92px;
                resize: vertical
            }

            input:focus,textarea:focus,select:focus {
                border-color: var(--blue)
            }

            label {
                display: block;
                font-weight: 650;
                font-size: 12px;
                margin-bottom: 7px
            }

            .field {
                margin-bottom: 15px
            }

            .stat {
                font-size: 29px;
                font-weight: 850;
                margin: 12px 0 0
            }

            .listitem {
                padding: 14px 0;
                border-bottom: 1px solid var(--line)
            }

            .listitem:last-child {
                border: 0
            }

            .table {
                width: 100%;
                border-collapse: collapse
            }

            .table td,.table th {
                text-align: left;
                padding: 13px 8px;
                border-bottom: 1px solid var(--line)
            }

            .table th {
                font-size: 12px;
                color: var(--muted)
            }

            .tabs {
                display: flex;
                gap: 8px;
                overflow: auto;
                margin-bottom: 20px
            }

            .tabs button {
                white-space: nowrap
            }

            .tabs .selected {
                background: var(--navy);
                color: white
            }

            .floor {
                position: relative;
                width: 100%;
                height: 370px;
                background-color: #fafcff;
                background-image: linear-gradient(#dce5f2 1px,transparent 1px),linear-gradient(90deg,#dce5f2 1px,transparent 1px);
                background-size: 26px 26px;
                border: 2px solid #8495b0;
                border-radius: 8px;
                overflow: hidden;
                touch-action: none
            }

            .rooms {
                position: absolute;
                inset: 25px;
                display: grid;
                grid-template-columns: 1.2fr 1fr;
                grid-template-rows: 1fr 1fr;
                gap: 6px;
                transform-origin: center;
                transition: transform .15s
            }

            .room {
                border: 4px solid #5c6c83;
                background: #ffffffb9;
                display: grid;
                place-items: center;
                cursor: pointer;
                text-align: center;
                font-weight: 750
            }

            .room:hover,.room.active {
                background: #dce9ff
            }

            .device {
                position: absolute;
                background: #245cf5;
                color: white;
                border: 2px solid white;
                border-radius: 50%;
                width: 31px;
                height: 31px;
                display: grid;
                place-items: center;
                cursor: grab;
                box-shadow: 0 2px 8px #1b326b66;
                font-size: 12px;
                touch-action: none
            }

            .device.warn {
                background: #b65c28
            }

            .notice {
                border-left: 4px solid #e5a53a;
                background: #fff9ee;
                padding: 12px;
                border-radius: 8px;
                margin: 10px 0
            }

            .overlay {
                position: fixed;
                inset: 0;
                background: #0d1a30a8;
                z-index: 20;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px
            }

            .modal {
                background: white;
                border-radius: 18px;
                padding: 25px;
                max-width: 540px;
                width: 100%;
                max-height: 90vh;
                overflow: auto
            }

            .toast {
                position: fixed;
                bottom: 22px;
                right: 22px;
                background: #13233d;
                color: white;
                padding: 13px 19px;
                border-radius: 12px;
                z-index: 40
            }

            .landing {
                min-height: 100vh;
                background: linear-gradient(125deg,#101e38,#193a75);
                color: white;
                padding: 28px
            }

            .hero {
                max-width: 1080px;
                margin: 80px auto;
                display: grid;
                grid-template-columns: 1.2fr 1fr;
                gap: 50px;
                align-items: center
            }

            .hero h1 {
                font-size: clamp(36px,5vw,66px);
                line-height: 1.06
            }

            .hero p {
                font-size: 18px;
                color: #cfddf4
            }

            .herobox {
                background: #ffffff15;
                border: 1px solid #ffffff3b;
                padding: 35px;
                border-radius: 22px
            }

            .authbox {
                max-width: 460px;
                margin: 9vh auto;
                background: white;
                padding: 32px;
                border-radius: 20px;
                color: var(--navy)
            }

            .req {
                font-size: 11px;
                color: #5875a7;
                background: #eef3fd;
                border-radius: 7px;
                padding: 4px 7px
            }

            .reqgrid {
                display: flex;
                gap: 6px;
                flex-wrap: wrap
            }

            .mobiletoggle {
                display: none
            }

            .empty {
                padding: 35px;
                text-align: center;
                color: var(--muted)
            }

            @media(max-width: 900px) {
                .sidebar {
                    width:70px;
                    padding: 15px 7px
                }

                .logo {
                    font-size: 14px;
                    margin: 8px 3px
                }

                .sidebtn {
                    justify-content: center
                }

                .sidebtn .txt {
                    display: none
                }

                .content {
                    padding: 20px
                }

                .grid {
                    grid-template-columns: 1fr 1fr
                }
            }

            @media(max-width: 600px) {
                .shell {
                    display:block
                }

                .sidebar {
                    width: 100%;
                    height: auto;
                    position: static;
                    display: flex;
                    overflow-x: auto;
                    padding: 8px
                }

                .logo,.sidebottom {
                    display: none
                }

                .sidebtn {
                    width: auto;
                    flex-shrink: 0;
                    padding: 10px
                }

                .sidebtn .txt {
                    display: inline;
                    font-size: 12px
                }

                .top {
                    padding: 12px
                }

                .content {
                    padding: 14px
                }

                .grid,.grid.two,.hero {
                    grid-template-columns: 1fr
                }

                .hero {
                    margin: 50px auto
                }

                .card {
                    padding: 16px
                }

                .floor {
                    height: 310px
                }

                .table {
                    font-size: 12px
                }

                .table td,.table th {
                    padding: 9px 3px
                }
            }

            .room-preview-grid {
                display: grid;
                grid-template-columns: repeat(2,minmax(0,1fr));
                gap: 12px;
                margin: 14px 0
            }

            .room-preview {
                border: 2px solid #dce5f2;
                border-radius: 13px;
                background: #fff;
                padding: 10px;
                text-align: left;
                cursor: pointer;
                overflow: hidden
            }

            .room-preview.active {
                border-color: #245cf5;
                background: #f0f5ff
            }

            .room-preview svg {
                width: 100%;
                height: 145px;
                display: block;
                background: #f8fafc;
                border-radius: 8px
            }

            .room-preview strong {
                display: block;
                margin: 9px 2px 3px
            }

            .room-preview small {
                color: #65738a
            }

            .room-preview:hover {
                border-color: #245cf5
            }

            @media(max-width: 600px) {
                .room-preview-grid {
                    grid-template-columns:1fr 1fr;
                    gap: 8px
                }

                .room-preview svg {
                    height: 115px
                }
            }

            .product-photo {
                height: 155px;
                background: #f4f7fb;
                border-radius: 12px;
                margin-bottom: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden
            }

            .product-photo img {
                width: 100%;
                height: 100%;
                object-fit: contain
            }

            .room-illustrated {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;
                padding: 5px;
                min-height: 0;
                overflow: hidden
            }

            .room-plan {
                height: calc(100% - 28px);
                width: 100%;
                max-width: 180px;
                min-height: 35px;
                pointer-events: none
            }

            .room-name {
                display: block;
                font-size: 12px;
                line-height: 1.2;
                padding: 3px 7px;
                border-radius: 6px;
                background: #eaf0ff;
                color: #172d55;
                pointer-events: none
            }

            .room-illustrated.active .room-name {
                background: #245cf5;
                color: white
            }

            @media(max-width: 600px) {
                .room-name {
                    font-size:10px
                }

                .room-illustrated {
                    padding: 2px
                }
            }

            /* Lobal Tech — refinamento responsivo: desktop, tablet e celular */
            html {
                scroll-behavior: smooth;
                -webkit-text-size-adjust: 100%
            }

            body {
                min-width: 0;
                overflow-x: hidden
            }

            img,svg,video,canvas {
                max-width: 100%
            }

            .main,.content,.card,.grid>*,.grid.two>* {
                min-width: 0
            }

            .card {
                overflow-wrap: anywhere
            }

            .table {
                display: block;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                white-space: nowrap
            }

            .table th,.table td {
                white-space: nowrap
            }

            button,.btn,.sidebtn {
                touch-action: manipulation
            }

            input,select,textarea {
                min-width: 0
            }

            .floor {
                max-width: 100%;
                isolation: isolate
            }

            .rooms {
                min-width: 0;
                min-height: 0
            }

            .room {
                min-width: 0;
                min-height: 0;
                overflow: hidden
            }

            .room img {
                max-width: 100%;
                object-fit: contain
            }

            @media(min-width: 1200px) {
                .content {
                    padding:34px 42px
                }

                .grid {
                    gap: 20px
                }
            }

            @media(min-width: 601px) and (max-width:1100px) {
                .sidebar {
                    width:190px;
                    padding: 16px 9px
                }

                .sidebar .logo {
                    font-size: 19px
                }

                .sidebtn {
                    padding: 11px 9px;
                    gap: 8px
                }

                .content {
                    padding: 22px
                }

                .grid {
                    grid-template-columns: repeat(2,minmax(0,1fr))
                }

                .hero {
                    gap: 22px
                }
            }

            @media(max-width: 750px) {
                .grid,.grid.two {
                    grid-template-columns:1fr
                }

                .hero {
                    grid-template-columns: 1fr
                }

                .top {
                    gap: 8px;
                    flex-wrap: wrap
                }

                .top .stack {
                    justify-content: flex-start
                }

                .floor {
                    height: 330px
                }
            }

            @media(max-width: 600px) {
                body {
                    font-size:14px
                }

                .shell {
                    display: flex;
                    flex-direction: column;
                    min-height: 100dvh
                }

                .sidebar {
                    width: 100%;
                    height: auto;
                    position: sticky;
                    top: 0;
                    z-index: 12;
                    display: flex;
                    align-items: center;
                    gap: 5px;
                    overflow-x: auto;
                    overscroll-behavior-x: contain;
                    scrollbar-width: thin;
                    padding: 8px 10px;
                    box-shadow: 0 3px 12px #091a3220
                }

                .sidebtn {
                    width: auto;
                    min-width: max-content;
                    flex-shrink: 0;
                    padding: 10px 12px;
                    border-radius: 9px;
                    gap: 6px
                }

                .sidebtn .txt {
                    display: inline;
                    font-size: 12px
                }

                .main {
                    width: 100%
                }

                .top {
                    position: relative;
                    padding: 11px 14px
                }

                .top>div:first-child {
                    min-width: 0;
                    overflow-wrap: anywhere
                }

                .content {
                    width: 100%;
                    padding: 16px 12px 30px
                }

                h1 {
                    font-size: clamp(23px,6vw,29px)
                }

                h2 {
                    font-size: 18px
                }

                .sub {
                    margin-bottom: 16px
                }

                .card {
                    padding: 15px;
                    border-radius: 14px;
                    margin-bottom: 13px
                }

                .grid,.grid.two {
                    grid-template-columns: minmax(0,1fr);
                    gap: 12px
                }

                .row {
                    align-items: flex-start
                }

                .stack {
                    gap: 7px
                }

                .btn {
                    max-width: 100%;
                    white-space: normal;
                    text-align: center;
                    padding: 10px 12px;
                    min-height: 40px
                }

                .btn.small {
                    min-height: 36px
                }

                .floor {
                    height: clamp(245px,72vw,350px)
                }

                .rooms {
                    inset: 12px;
                    gap: 4px
                }

                .room {
                    border-width: 2px;
                    font-size: 11px
                }

                .device {
                    width: 28px;
                    height: 28px
                }

                .landing {
                    padding: 16px
                }

                .hero {
                    margin: 40px auto;
                    gap: 22px
                }

                .hero h1 {
                    font-size: clamp(32px,9vw,48px)
                }

                .hero p {
                    font-size: 16px
                }

                .herobox,.authbox {
                    padding: 20px
                }

                .authbox {
                    margin: 35px auto
                }

                .modal {
                    padding: 18px;
                    max-height: 85dvh
                }

                .toast {
                    left: 12px;
                    right: 12px;
                    bottom: 12px;
                    text-align: center
                }
            }

            @media(max-width: 360px) {
                .content {
                    padding:12px 9px
                }

                .card {
                    padding: 12px
                }

                .sidebtn {
                    padding: 9px 10px
                }

                .floor {
                    height: 250px
                }
            }

            @media(prefers-reduced-motion:reduce) {
                html {
                    scroll-behavior: auto
                }

                *,*::before,*::after {
                    transition: none!important;
                    animation: none!important
                }
            }
        </style>
    </head>

            function inspections() {
                let p = project();
                return `<h1>Inspeções e parecer técnico</h1><p class="sub">Agende visitas, registre resultados por ambiente e envie pareceres.</p>${panel('Agendar inspeção', `<form onsubmit="addInspection(event)"><div class="grid two">${field('date', 'Data da visita', '', 'date')}${field('time', 'Horário', '', 'time')}</div><div class="field"><label>Ambiente</label><select name="room">${p.rooms.map(r => `<option>${esc(r)}</option>`).join('')}</select></div><div class="field"><label>Observações e roteiro</label><textarea name="note" placeholder="Verificar infraestrutura, pontos elétricos, rede e viabilidade"></textarea></div><button class="btn primary">Agendar e registrar</button></form>`)}${panel('Roteiro de inspeção', `<p>☐ Conferir infraestrutura elétrica e quadro de distribuição</p><p>☐ Avaliar conectividade e cobertura de rede</p><p>☐ Verificar posição e compatibilidade dos dispositivos</p><p>☐ Fotografar pontos críticos e registrar riscos</p><p>☐ Validar orçamento, cronograma e pendências</p>`)}${panel('Registros e pareceres', p.inspections.map( (x, i) => `<div class="listitem"><div class="row"><b>${esc(x.room)} • ${esc(x.date)} ${esc(x.time)}</b>${badge(x.status || 'Agendada')}</div><p>${esc(x.note)}</p><div class="stack">${b('Registrar parecer', `inspectionOpinion(${i})`, 'small')}${b('Responder', `inspectionReply(${i})`, 'small')}${b('Anexar arquivo', `attachInspection(${i})`, 'small')}</div>${x.opinion ? `<p class="notice">Parecer: ${esc(x.opinion)} ${x.reply ? '• Resposta: ' + esc(x.reply) : ''}</p>` : ''}</div>`).join('') || '<p class="muted">Nenhuma inspeção agendada.</p>')}`
            }
            function addInspection(e) {
                e.preventDefault();
                project().inspections.push({
                    ...formData(e.target),
                    status: 'Agendada'
                });
                notify('Inspeção técnica agendada');
                log('Inspeção agendada');
                render()
            }
            function inspectionOpinion(i) {
                let x = project().inspections[i]
                  , t = prompt('Parecer técnico (riscos, incompatibilidades, custos e prazos):');
                if (t) {
                    x.opinion = t;
                    x.status = 'Parecer emitido';
                    notify('Novo parecer técnico enviado ao arquiteto');
                    log('Parecer técnico emitido');
                    render()
                }
            }
            function inspectionReply(i) {
                let x = project().inspections[i]
                  , t = prompt('Resposta do arquiteto:');
                if (t) {
                    x.reply = t;
                    log('Arquiteto respondeu ao parecer');
                    render()
                }
            }
            function attachInspection(i) {
                let t = prompt('Nome ou descrição do anexo da inspeção:');
                if (t) {
                    project().inspections[i].note += ' | Anexo: ' + t;
                    log('Anexo de inspeção registrado');
                    render()
                }
            }
            function versions() {
                let p = project();
                return `<h1>Revisões e versões</h1><p class="sub">Registre alterações e solicite novas análises.</p>${panel('Nova revisão', `<div class="field"><label>Descrição da alteração</label><textarea id="revision" placeholder="Ex.: Mover interruptor para coluna Y"></textarea></div><div class="stack">${b('Confirmar nova versão', "addVersion()", 'primary')}${b('Solicitar nova análise', "requestAnalysis()")}${b('Solicitar inspeção', "go('Inspeções')")}</div>`)}${panel('Histórico de versões', p.versions.map( (v, i) => `<div class="listitem row"><div><b>Versão ${v.n}</b><p class="muted">${esc(v.at)} • ${esc(v.time)}</p></div>${i > 0 ? b('Comparar anterior', `compareVersion(${i})`, 'small') : ''}</div>`).join(''))}`
            }
            function addVersion() {
                let t = document.getElementById('revision').value.trim();
                if (!t)
                    return toast('Descreva a alteração');
                let p = project();
                p.versions.push({
                    n: p.versions.length + 1,
                    at: t,
                    time: now()
                });
                p.status = 'Revisão pendente';
                notify('Nova versão do projeto enviada aos responsáveis');
                log('Nova versão criada: ' + t);
                render()
            }
            function compareVersion(i) {
                let a = project().versions;
                openModal(`<h2>Comparação de versões</h2><p><b>Anterior:</b> ${esc(a[i - 1].at)}</p><p><b>Atual:</b> ${esc(a[i].at)}</p><p class="muted">Diferenças textuais registradas. Comparação geométrica de plantas exige motor CAD/BIM.</p>`)
            }
            function requestAnalysis() {
                notify('Nova análise ou inspeção solicitada');
                project().status = 'Em análise';
                log('Nova análise solicitada');
                render()
            }
            function execution() {
                let p = project();
                return `<h1>Execução da obra</h1><p class="sub">Planeje etapas, registre instalações e acompanhe custos e pendências.</p>${panel('Controle da execução', `<div class="stack">${b('Aprovar e liberar execução', "approveExecution()", 'primary')}${b('Adicionar etapa', "addStep()")}${b('Atualizar orçamento e prazo', "updateBudget()")}${b('Encerrar projeto', "finishProject()")}</div><p>Status atual: ${badge(p.status)}</p>`)}${panel('Etapas da obra', p.steps.map( (x, i) => `<div class="listitem row"><div><b>${esc(x.name)}</b><p class="muted">${esc(x.room)} • ${esc(x.note || 'Sem ocorrências')}</p></div><div class="stack">${badge(x.status)}${b('Atualizar', `updateStep(${i})`, 'small')}</div></div>`).join('') || '<p class="muted">Nenhuma etapa cadastrada.</p>')}${panel('Indicadores', `<p>Orçamento: R$ ${Number(p.budget).toLocaleString('pt-BR')} • Prazo: ${p.days} dias</p><p>Etapas concluídas: ${p.steps.filter(x => x.status === 'Concluído').length} de ${p.steps.length}</p><p>Dispositivos cadastrados: ${p.devices.length}</p>`)}`
            }
            function approveExecution() {
                project().status = 'Aprovado para execução';
                notify('Projeto aprovado para execução');
                log('Projeto liberado para execução');
                render()
            }
            function addStep() {
                openForm('Nova etapa', [['name', 'Nome da etapa'], ['room', 'Ambiente', selectedRoom], ['note', 'Observações']], d => {
                    project().steps.push({
                        ...d,
                        status: 'Pendente'
                    });
                    log('Etapa criada');
                    render()
                }
                )
            }
            function updateStep(i) {
                let x = project().steps[i];
                openForm('Atualizar etapa', [['status', 'Status (Pendente, Em andamento, Concluído)', x.status], ['note', 'Dispositivos instalados / ocorrências', x.note]], d => {
                    Object.assign(x, d);
                    log('Andamento atualizado');
                    render()
                }
                )
            }
            function updateBudget() {
                openForm('Custos e prazos', [['budget', 'Orçamento (R$)', project().budget], ['days', 'Prazo em dias', project().days]], d => {
                    project().budget = Number(d.budget);
                    project().days = Number(d.days);
                    log('Custos e prazos atualizados');
                    render()
                }
                )
            }
            function finishProject() {
                if (!confirm('Encerrar projeto?'))
                    return;
                project().status = 'Concluído';
                log('Projeto encerrado');
                notify('Projeto concluído');
                render()
            }
            function messages() {
                let p = project();
                return `<h1>Comunicação interna</h1><p class="sub">Mensagens e histórico vinculados ao projeto, ambientes e dispositivos.</p>${panel('Nova mensagem', `<form onsubmit="sendMessage(event)"><div class="field"><label>Ambiente ou dispositivo</label><select name="room"><option>Geral</option>${p.rooms.map(x => `<option>${esc(x)}</option>`).join('')}${p.devices.map(x => `<option>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Mensagem (use @ para mencionar)</label><textarea name="text" required></textarea></div><button class="btn primary">Enviar mensagem</button></form>`)}${panel('Histórico', p.messages.slice().reverse().map(x => `<div class="listitem"><div class="row"><b>${esc(x.by)}</b><span class="muted">${esc(x.time)}</span></div><span class="pill">${esc(x.room)}</span><p>${esc(x.text)}</p></div>`).join('') || '<p class="muted">Nenhuma mensagem enviada.</p>')}`
            }
            function sendMessage(e) {
                e.preventDefault();
                let d = formData(e.target);
                project().messages.push({
                    ...d,
                    by: user().name,
                    time: now()
                });
                if (d.text.includes('@'))
                    notify('Você foi mencionado em uma conversa do projeto');
                log('Mensagem enviada');
                render()
            }
            function notifications() {
                return `<h1>Central de notificações</h1><p class="sub">Acompanhe alertas de prazo, segurança, custo e alterações.</p>${panel('Notificações', `<div class="stack">${b('Marcar todas como lidas', "readAll()")}</div>${db.notifications.map( (n, i) => `<div class="listitem row"><div>${n.read ? '' : '🔵 '}<b>${esc(n.msg)}</b><p class="muted">${esc(n.time)}</p></div>${!n.read ? b('Marcar lida', `readOne(${i})`, 'small') : badge('Lida')}</div>`).join('') || '<p class="muted">Nenhuma notificação.</p>'}`)}`
            }
            function readAll() {
                db.notifications.forEach(n => n.read = true);
                save();
                render()
            }
            function readOne(i) {
                db.notifications[i].read = true;
                save();
                render()
            }
            function commercial() {
                return `<h1>Clientes e oportunidades</h1><p class="sub">Acompanhe contatos, propostas e vínculo com arquitetos.</p>${panel('Ações', `<div class="stack">${b('+ Cadastrar cliente', "newClient()", 'primary')}${b('Novo contato', "go('Contato')")}</div>`)}${panel('Clientes', db.clients.map( (c, i) => `<div class="listitem row"><div><b>${esc(c.name)}</b><p class="muted">${esc(c.email)} • Arquiteto: ${esc(c.architect)}</p></div><div class="stack">${badge(c.stage)}${b('Editar', `editClient(${i})`, 'small')}</div></div>`).join(''))}${panel('Contatos recebidos', db.contacts.map(c => `<div class="listitem"><b>${esc(c.name)}</b> • ${esc(c.email)}<p>${esc(c.message)}</p></div>`).join('') || '<p class="muted">Nenhum contato recebido.</p>')}`
            }
            function newClient() {
                openForm('Cadastrar cliente', [['name', 'Nome'], ['email', 'E-mail'], ['architect', 'Arquiteto responsável'], ['stage', 'Etapa comercial']], d => {
                    db.clients.push({
                        id: Date.now(),
                        ...d
                    });
                    log('Cliente cadastrado');
                    render()
                }
                )
            }
            function editClient(i) {
                let c = db.clients[i];
                openForm('Editar cliente', [['name', 'Nome', c.name], ['email', 'E-mail', c.email], ['architect', 'Arquiteto responsável', c.architect], ['stage', 'Etapa comercial', c.stage]], d => {
                    Object.assign(c, d);
                    log('Cliente atualizado');
                    render()
                }
                )
            }
            function users() {
                return `<h1>Usuários e permissões</h1><p class="sub">Gerencie contas e perfis. Acesso demonstrativo, sem autenticação de produção.</p>${panel('Novo usuário', b('Cadastrar usuário', "newUser()", 'primary'))}${panel('Contas cadastradas', `<table class="table"><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Ações</th></tr>${db.users.map( (u, i) => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${badge(u.role)}</td><td>${b('Editar', `editUser(${i})`, 'small')}</td></tr>`).join('')}</table>`)}${panel('Regras de acesso', `<p><b>Administrador:</b> gestão completa, aprovação e auditoria.</p><p><b>Arquiteto:</b> criação, revisão, dispositivos e acompanhamento.</p><p><b>Técnico:</b> inspeção, parecer e execução.</p><p><b>Cliente:</b> acompanhamento e comunicação.</p><p class="notice">As regras acima são ilustrativas. Permissões reais precisam ser validadas em servidor.</p>`)}`
            }
            function newUser() {
                openForm('Cadastrar usuário', [['name', 'Nome'], ['email', 'E-mail'], ['password', 'Senha'], ['role', 'Perfil']], d => {
                    db.users.push({
                        id: Date.now(),
                        ...d
                    });
                    log('Usuário cadastrado');
                    render()
                }
                )
            }
            function editUser(i) {
                let u = db.users[i];
                openForm('Editar usuário', [['name', 'Nome', u.name], ['email', 'E-mail', u.email], ['role', 'Perfil', u.role]], d => {
                    Object.assign(u, d);
                    log('Permissões atualizadas');
                    render()
                }
                )
            }
            function audit() {
                return `<h1>Auditoria e relatórios</h1><p class="sub">Histórico de alterações, responsáveis, decisões e exportação.</p>${panel('Relatórios', `<div class="stack">${b('Exportar auditoria CSV', "exportCSV('audit')", 'primary')}${b('Relatório PDF (impressão)', "window.print()")}${b('Exportar projeto CSV', "exportCSV('project')")}</div>`)}${panel('Linha do tempo do projeto', db.audit.filter(x => x.project === project().name).map(x => `<div class="listitem"><b>${esc(x.action)}</b><p class="muted">${esc(x.by)} • ${esc(x.time)}</p></div>`).join('') || '<p class="muted">Sem alterações registradas.</p>')}${panel('Registro de acessos e decisões', `<table class="table"><tr><th>Data</th><th>Responsável</th><th>Ação</th></tr>${db.audit.map(x => `<tr><td>${esc(x.time)}</td><td>${esc(x.by)}</td><td>${esc(x.action)}</td></tr>`).join('')}</table>`)}`
            }
            function exportCSV(type) {
                let p = project()
                  , rows = type === 'audit' ? [['Data', 'Responsável', 'Ação', 'Projeto'], ...db.audit.map(x => [x.time, x.by, x.action, x.project])] : type === 'simulacao' ? [['Projeto', 'Dispositivos', 'Potência (W)', 'Custo'], [p.name, p.devices.length, p.devices.reduce( (a, x) => a + (Number(x.watts) || 0), 0), p.devices.reduce( (a, x) => a + (Number(x.cost) || 0), 0)]] : [['Projeto', 'Cliente', 'Status', 'Ambiente', 'Dispositivo'], ...p.devices.map(x => [p.name, p.client, p.status, x.room, x.name])];
                let csv = '\ufeff' + rows.map(r => r.map(v => '"' + String(v).replaceAll('"', '""') + '"').join(';')).join('\r\n');
                let a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([csv],{
                    type: 'text/csv;charset=utf-8'
                }));
                a.download = 'lobal_' + type + '.csv';
                a.click();
                URL.revokeObjectURL(a.href);
                log('Relatório exportado: ' + type)
            }
            function requirements() {
                return `<h1>Requisitos funcionais RF01–RF60</h1><p class="sub">Rastreabilidade entre os requisitos e as áreas do protótipo.</p>${MODULES.map( ([name,start,end]) => panel(`${name} · RF${String(start).padStart(2, '0')}–RF${end}`, `<div class="stack" style="margin-bottom:14px">${b('Abrir módulo', `go('${name === 'Início' ? 'Dashboard' : name}')`, 'small primary')}</div>${REQS.slice(start - 1, end).map( (r, i) => `<div class="listitem"><span class="req">RF${String(start + i).padStart(2, '0')}</span> ${esc(r)}</div>`).join('')}`)).join('')}`
            }
            function openModal(html) {
                modal = html;
                render()
            }
            function closeModal() {
                modal = null;
                render()
            }
            function openForm(title, fields, cb) {
                window.formCallback = cb;
                openModal(`<h2>${esc(title)}</h2><form onsubmit="submitGeneric(event)">${fields.map(f => field(...f)).join('')}<div class="stack"><button class="btn primary">Salvar</button>${b('Cancelar', "closeModal()")}</div></form>`)
            }
            function submitGeneric(e) {
                e.preventDefault();
                let d = formData(e.target);
                modal = null;
                window.formCallback(d);
                save();
                render()
            }
            function render() {
                let root = document.getElementById('root');
                let content;
                if (page === 'Início')
                    content = home();
                else if (page === 'Login')
                    content = auth();
                else if (page === 'Cadastro')
                    content = auth(true);
                else if (page === 'Contato')
                    content = contact();
                else if (!user()) {
                    page = 'Login';
                    content = auth()
                } else {
                    let map = {
                        'Dashboard': dashboard,
                        'Comercial': commercial,
                        'Projetos': projects,
                        'Dispositivos': devices,
                        'Simulações': simulation,
                        'Inspeções': inspections,
                        'Versões': versions,
                        'Execução': execution,
                        'Mensagens': messages,
                        'Notificações': notifications,
                        'Auditoria': audit,
                        'Usuários': users,
                        'Requisitos': requirements
                    };
                    content = layout((map[page] || dashboard)())
                }
                root.innerHTML = content + (modal ? `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${modal}</div></div>` : '');
                save()
            }
            ;render();
        </script>
    </body>
</html>
