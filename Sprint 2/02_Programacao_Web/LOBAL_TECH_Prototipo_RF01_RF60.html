<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOBAL TECH • Plataforma de Automação</title><style>
:root{--navy:#101c32;--blue:#245cf5;--sky:#eaf0ff;--line:#e4eaf3;--bg:#f5f7fb;--muted:#65738a;--green:#14845c;--orange:#aa6519}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--navy)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45}a{color:inherit}.shell{display:flex;min-height:100vh}.sidebar{width:242px;flex-shrink:0;background:#101d34;color:#eaf0fc;padding:24px 14px;position:sticky;top:0;height:100vh;overflow:auto}.logo{font-size:23px;font-weight:900;letter-spacing:-1px;margin:4px 10px 25px}.logo span{color:#79a9ff}.sidebtn{width:100%;background:transparent;border:0;text-align:left;color:#c5d2e7;padding:12px 13px;border-radius:10px;margin:2px 0;display:flex;gap:12px;align-items:center}.sidebtn.active,.sidebtn:hover{background:#243b62;color:white}.sidebottom{border-top:1px solid #32435f;margin-top:24px;padding-top:12px}.main{flex:1;min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}.content{max-width:1280px;padding:30px;margin:auto}.muted{color:var(--muted)}h1{font-size:29px;letter-spacing:-.7px;margin:6px 0}h2{font-size:20px;margin:0 0 16px}h3{font-size:16px;margin:4px 0 12px}.sub{margin:0 0 25px;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:0 5px 20px #152b4906;margin-bottom:17px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.btn{background:#fff;border:1px solid #d7e0ec;border-radius:10px;padding:10px 14px;color:var(--navy);font-weight:650}.btn:hover{border-color:var(--blue)}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{color:#a22d3b}.btn.small{padding:6px 10px;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stack{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.pill{background:var(--sky);color:#2154bb;border-radius:30px;padding:5px 10px;font-size:12px;font-weight:700}.pill.green{background:#e5f7ef;color:#08754b}.pill.orange{background:#fff1dc;color:#955814}.pill.red{background:#fff0f1;color:#a53643}input,select,textarea{border:1px solid #d9e1ed;border-radius:10px;background:#fff;padding:11px 12px;max-width:100%;width:100%;outline:none}textarea{min-height:92px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--blue)}label{display:block;font-weight:650;font-size:12px;margin-bottom:7px}.field{margin-bottom:15px}.stat{font-size:29px;font-weight:850;margin:12px 0 0}.listitem{padding:14px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:13px 8px;border-bottom:1px solid var(--line)}.table th{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.tabs button{white-space:nowrap}.tabs .selected{background:var(--navy);color:white}.floor{position:relative;width:100%;height:370px;background-color:#fafcff;background-image:linear-gradient(#dce5f2 1px,transparent 1px),linear-gradient(90deg,#dce5f2 1px,transparent 1px);background-size:26px 26px;border:2px solid #8495b0;border-radius:8px;overflow:hidden;touch-action:none}.rooms{position:absolute;inset:25px;display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:1fr 1fr;gap:6px;transform-origin:center;transition:transform .15s}.room{border:4px solid #5c6c83;background:#ffffffb9;display:grid;place-items:center;cursor:pointer;text-align:center;font-weight:750}.room:hover,.room.active{background:#dce9ff}.device{position:absolute;background:#245cf5;color:white;border:2px solid white;border-radius:50%;width:31px;height:31px;display:grid;place-items:center;cursor:grab;box-shadow:0 2px 8px #1b326b66;font-size:12px;touch-action:none}.device.warn{background:#b65c28}.notice{border-left:4px solid #e5a53a;background:#fff9ee;padding:12px;border-radius:8px;margin:10px 0}.overlay{position:fixed;inset:0;background:#0d1a30a8;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.modal{background:white;border-radius:18px;padding:25px;max-width:540px;width:100%;max-height:90vh;overflow:auto}.toast{position:fixed;bottom:22px;right:22px;background:#13233d;color:white;padding:13px 19px;border-radius:12px;z-index:40}.landing{min-height:100vh;background:linear-gradient(125deg,#101e38,#193a75);color:white;padding:28px}.hero{max-width:1080px;margin:80px auto;display:grid;grid-template-columns:1.2fr 1fr;gap:50px;align-items:center}.hero h1{font-size:clamp(36px,5vw,66px);line-height:1.06}.hero p{font-size:18px;color:#cfddf4}.herobox{background:#ffffff15;border:1px solid #ffffff3b;padding:35px;border-radius:22px}.authbox{max-width:460px;margin:9vh auto;background:white;padding:32px;border-radius:20px;color:var(--navy)}.req{font-size:11px;color:#5875a7;background:#eef3fd;border-radius:7px;padding:4px 7px}.reqgrid{display:flex;gap:6px;flex-wrap:wrap}.mobiletoggle{display:none}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:900px){.sidebar{width:70px;padding:15px 7px}.logo{font-size:14px;margin:8px 3px}.sidebtn{justify-content:center}.sidebtn .txt{display:none}.content{padding:20px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.shell{display:block}.sidebar{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:8px}.logo,.sidebottom{display:none}.sidebtn{width:auto;flex-shrink:0;padding:10px}.sidebtn .txt{display:inline;font-size:12px}.top{padding:12px}.content{padding:14px}.grid,.grid.two,.hero{grid-template-columns:1fr}.hero{margin:50px auto}.card{padding:16px}.floor{height:310px}.table{font-size:12px}.table td,.table th{padding:9px 3px}}
</style></head><body><div id="root"></div><script>
const REQS=["Cadastrar e autenticar usuários.", "Recuperar senha e controlar o acesso por perfil.", "Gerenciar usuários e permissões.", "Registrar acessos realizados no sistema.", "Apresentar página inicial institucional.", "Direcionar clientes cadastrados para o login.", "Direcionar novos interessados para o atendimento comercial.", "Disponibilizar os canais de contato da empresa.", "Registrar tentativas de contato e notificar o Comercial.", "Cadastrar clientes e acompanhar oportunidades comerciais.", "Vincular o cliente ao arquiteto responsável.", "Criar, pesquisar, filtrar e arquivar projetos.", "Vincular cliente, arquiteto, técnico e administrador ao projeto.", "Anexar e visualizar a planta do projeto.", "Permitir zoom e movimentação sobre a planta.", "Identificar, selecionar e navegar pelos ambientes.", "Apresentar informações e situação de cada ambiente.", "Disponibilizar um catálogo de dispositivos de automação.", "Pesquisar e filtrar os dispositivos disponíveis.", "Apresentar as especificações de cada dispositivo.", "Arrastar e posicionar dispositivos na planta.", "Inserir, mover, substituir e retirar dispositivos.", "Alertar sobre possíveis incompatibilidades.", "Solicitar e visualizar simulações do projeto.", "Comparar diferentes configurações do projeto.", "Apresentar estimativas de consumo, economia, custo e prazo.", "Gerar relatórios da simulação.", "Encaminhar o projeto ao administrador e ao técnico.", "Agendar a inspeção técnica presencial.", "Apresentar um roteiro para a inspeção.", "Registrar a inspeção por ambiente.", "Anexar fotos, vídeos, documentos e observações.", "Emitir e enviar o parecer técnico ao arquiteto.", "Registrar riscos, incompatibilidades, custos e prazos.", "Permitir que o arquiteto responda ao parecer.", "Permitir a continuidade ou edição do projeto.", "Criar uma nova versão após cada edição confirmada.", "Comparar versões e destacar alterações.", "Reenviar alterações ao administrador e ao técnico.", "Solicitar nova análise ou inspeção técnica.", "Liberar o projeto aprovado para execução.", "Planejar e registrar as etapas da obra.", "Atualizar o andamento por ambiente e dispositivo.", "Registrar dispositivos instalados e ocorrências.", "Atualizar custos, prazos e pendências.", "Permitir ao administrador acompanhar a execução.", "Permitir ao arquiteto inspecionar o andamento.", "Concluir ambientes e encerrar o projeto.", "Disponibilizar comunicação interna por projeto.", "Vincular mensagens a ambientes e dispositivos.", "Permitir mensagens, menções e anexos.", "Manter o histórico das comunicações.", "Disponibilizar uma central de notificações.", "Notificar responsáveis sobre alterações e pendências.", "Destacar alertas de segurança, custo, prazo e viabilidade.", "Manter o histórico completo das alterações.", "Registrar responsáveis, datas, horários e decisões.", "Apresentar uma linha do tempo do projeto.", "Gerar relatórios de auditoria.", "Exportar relatórios em PDF ou planilha."], MODULES=[["Início", 1, 9, "⌂"], ["Comercial", 10, 11, "◇"], ["Projetos", 12, 17, "▦"], ["Dispositivos", 18, 23, "◈"], ["Simulações", 24, 28, "◉"], ["Inspeções", 29, 36, "⌕"], ["Versões", 37, 40, "↺"], ["Execução", 41, 48, "▤"], ["Mensagens", 49, 52, "✉"], ["Notificações", 53, 55, "♧"], ["Auditoria", 56, 60, "≡"]];
const initial={users:[{id:1,name:'Administrador',email:'admin@lobal.tech',password:'123456',role:'Administrador'},{id:2,name:'Ana Arquiteta',email:'arquiteta@lobal.tech',password:'123456',role:'Arquiteto'},{id:3,name:'João Técnico',email:'tecnico@lobal.tech',password:'123456',role:'Técnico'}],clients:[{id:1,name:'Mariana Costa',email:'mariana@exemplo.com',architect:'Ana Arquiteta',stage:'Proposta'}],projects:[{id:1,name:'Residência Aurora',client:'Mariana Costa',architect:'Ana Arquiteta',tech:'João Técnico',admin:'Administrador',status:'Em análise',archived:false,rooms:['Sala de Estar','Cozinha','Suíte','Escritório'],devices:[],versions:[{n:1,at:'Versão inicial',time:new Date().toLocaleString('pt-BR')}],steps:[],inspections:[],messages:[],simulation:[],notes:[],files:[],budget:24000,days:45}],notifications:[],audit:[],contacts:[],session:null};
let db;try{db=JSON.parse(localStorage.getItem('lobal_tech_v60'))||structuredClone(initial)}catch(e){db=structuredClone(initial)};let page='Início',pid=1,selectedRoom='Sala de Estar',zoom=1,filter='',modal=null,simA=null,activeDevice=null;const catalog=[{name:'Interruptor inteligente',category:'Iluminação',watts:2,cost:280},{name:'Lâmpada LED inteligente',category:'Iluminação',watts:9,cost:145},{name:'Sensor de presença',category:'Segurança',watts:1,cost:210},{name:'Câmera IP',category:'Segurança',watts:8,cost:650},{name:'Termostato inteligente',category:'Climatização',watts:3,cost:480},{name:'Controle de cortinas',category:'Conforto',watts:25,cost:790},{name:'Hub de automação',category:'Rede',watts:12,cost:1250},{name:'Fechadura inteligente',category:'Segurança',watts:4,cost:1150}];
function save(){try{localStorage.setItem('lobal_tech_v60',JSON.stringify(db))}catch(e){}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function user(){return db.users.find(u=>u.id===db.session)}function project(){return db.projects.find(p=>p.id===pid)||db.projects[0]}function now(){return new Date().toLocaleString('pt-BR')}function log(action){db.audit.unshift({time:now(),by:user()?.name||'Visitante',action,project:project()?.name||'—'});save()}function notify(msg){db.notifications.unshift({msg,time:now(),read:false});save()}function toast(s){let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2600)}function go(p){page=p;filter='';render();window.scrollTo(0,0)}function badge(t){return `<span class="pill ${/Concluído|Aprovado|Instalado/.test(t)?'green':/Pendente|Análise|Risco/.test(t)?'orange':''}">${esc(t)}</span>`}function b(text,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${text}</button>`}function field(name,label,value='',type='text'){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${type==='file'?'multiple':''}></div>`}function formData(f){return Object.fromEntries(new FormData(f).entries())}function req(start,end){return `<div class="reqgrid">${Array.from({length:end-start+1},(_,i)=>`<span class="req">RF${String(start+i).padStart(2,'0')}</span>`).join('')}</div>`}function panel(title,body,footer=''){return `<section class="card"><div class="row"><h2>${title}</h2>${footer}</div>${body}</section>`}function stat(t,v){return `<div class="card"><span class="muted">${t}</span><div class="stat">${v}</div></div>`}
function home(){return `<div class="landing"><div class="row"><div class="logo">LOBAL<span> TECH</span></div><div class="stack">${b('Entrar',"go('Login')")}${b('Solicitar atendimento',"go('Contato')",'primary')}</div></div><div class="hero"><div><div style="letter-spacing:3px;color:#a9c8ff">AUTOMAÇÃO + ARQUITETURA</div><h1>Projetos inteligentes, do conceito à execução.</h1><p>Centralize plantas, dispositivos, análises técnicas, inspeções e acompanhamento de obra em um só lugar.</p><div class="stack">${b('Acessar plataforma',"go('Login')",'primary')}${b('Falar com o comercial',"go('Contato')")}</div></div><div class="herobox"><h2>Uma plataforma, todas as etapas</h2><p>01 • Planejamento e ambientes</p><p>02 • Dispositivos e simulações</p><p>03 • Inspeção e aprovação</p><p>04 • Execução e auditoria</p><hr style="opacity:.2"><p>Contato: comercial@lobal.tech</p></div></div></div>`}
function auth(register=false){return `<div class="landing"><div class="row"><div class="logo">LOBAL<span> TECH</span></div>${b('Página inicial',"go('Início')")}</div><div class="authbox"><h1>${register?'Criar conta':'Entrar na plataforma'}</h1><p class="muted">${register?'Cadastre-se para acompanhar projetos.':'Contas demonstrativas: admin@lobal.tech, arquiteta@lobal.tech ou tecnico@lobal.tech — senha 123456'}</p><form onsubmit="loginSubmit(event,${register})">${register?field('name','Nome completo'):''}${field('email','E-mail','','email')}${field('password','Senha','','password')}${register?`<div class="field"><label>Perfil</label><select name="role"><option>Cliente</option><option>Arquiteto</option><option>Técnico</option></select></div>`:''}<button class="btn primary" style="width:100%">${register?'Cadastrar':'Entrar'}</button></form><p>${b(register?'Já tenho conta':'Criar conta',`go('${register?'Login':'Cadastro'}')`)} ${!register?b('Recuperar senha',"recover()"):''}</p><small class="muted">Demonstração local: autenticação ilustrativa, sem servidor seguro.</small></div></div>`}
function loginSubmit(e,register){e.preventDefault();let d=formData(e.target);if(register){if(db.users.some(u=>u.email===d.email))return toast('E-mail já cadastrado');let u={id:Date.now(),...d};db.users.push(u);db.session=u.id;log('Cadastro de usuário');}else{let u=db.users.find(u=>u.email===d.email&&u.password===d.password);if(!u)return toast('Credenciais incorretas');db.session=u.id;log('Login efetuado')}save();go('Dashboard')}
function recover(){let email=prompt('Informe o e-mail cadastrado:');if(!email)return;let u=db.users.find(u=>u.email===email);if(u){let pass=prompt('Demonstração local: informe a nova senha (não há envio de e-mail):');if(pass){u.password=pass;save();toast('Senha atualizada')}}else toast('E-mail não localizado')}
function contact(){return `<div class="landing"><div class="row"><div class="logo">LOBAL<span> TECH</span></div>${b('Voltar',"go('Início')")}</div><div class="authbox"><h1>Atendimento comercial</h1><p>Fale com nossa equipe sobre seu projeto de automação.</p><form onsubmit="submitContact(event)">${field('name','Nome')}${field('email','E-mail','','email')}${field('phone','Telefone')}<div class="field"><label>Mensagem</label><textarea name="message" required></textarea></div><button class="btn primary">Enviar interesse</button></form><p class="muted">E-mail: comercial@lobal.tech • Canal demonstrativo</p></div></div>`}function submitContact(e){e.preventDefault();db.contacts.push({...formData(e.target),time:now()});notify('Novo contato comercial recebido');log('Solicitação de contato registrada');toast('Contato registrado no protótipo');go('Início')}
function layout(inner){let menus=['Dashboard',...MODULES.slice(1).map(m=>m[0]),'Usuários','Requisitos'];return `<div class="shell"><aside class="sidebar"><div class="logo">LOBAL<span> TECH</span></div>${menus.map((m,i)=>`<button class="sidebtn ${page===m?'active':''}" onclick="go('${m}')"><span>${['▣','◇','▦','◈','◉','⌕','↺','▤','✉','♧','≡','♙','☷'][i]}</span><span class="txt">${m}</span></button>`).join('')}<div class="sidebottom">${b('Sair',"logout()")}</div></aside><div class="main"><header class="top"><div><b>${esc(page)}</b> <span class="muted">/ ${esc(project()?.name||'Plataforma')}</span></div><div class="stack"><span class="pill">${esc(user()?.role||'Visitante')}</span>${b('🔔 '+db.notifications.filter(n=>!n.read).length,"go('Notificações')",'small')}${b('Sair',"logout()",'small')}</div></header><main class="content">${inner}</main></div></div>`}function logout(){log('Logout');db.session=null;save();go('Início')}
function dashboard(){let p=project();return `<h1>Visão geral</h1><p class="sub">Acompanhe as etapas e continue de onde parou.</p><div class="grid">${stat('Projetos',db.projects.filter(x=>!x.archived).length)}${stat('Dispositivos posicionados',db.projects.reduce((a,x)=>a+x.devices.length,0))}${stat('Notificações pendentes',db.notifications.filter(n=>!n.read).length)}</div>${panel('Ações rápidas',`<div class="stack">${b('Novo projeto',"newProject()",'primary')}${b('Abrir planta',"go('Projetos')")}${b('Ver simulações',"go('Simulações')")}${b('Agendar inspeção',"go('Inspeções')")}${b('Relatórios',"go('Auditoria')")}</div>`)}${panel('Projetos recentes',db.projects.map(x=>`<div class="listitem row"><div><b>${esc(x.name)}</b><p class="muted">${esc(x.client)} • ${esc(x.architect)}</p></div><div class="stack">${badge(x.status)}${b('Abrir →',`selectProject(${x.id})`,'small')}</div></div>`).join(''))}${panel('Próximos passos',`<p>1. Selecione um projeto e envie sua planta. 2. Escolha um ambiente e posicione dispositivos. 3. Execute a simulação. 4. Envie para análise técnica. 5. Planeje e acompanhe a obra.</p>`)}`}
function selectProject(id){pid=id;selectedRoom=project().rooms[0];go('Projetos')}
function newProject(){openForm('Novo projeto',[['name','Nome do projeto'],['client','Cliente'],['architect','Arquiteto responsável'],['tech','Técnico responsável']],d=>{let p={id:Date.now(),...d,admin:'Administrador',status:'Rascunho',archived:false,rooms:['Sala de Estar','Cozinha','Suíte'],devices:[],versions:[{n:1,at:'Criação',time:now()}],steps:[],inspections:[],messages:[],simulation:[],notes:[],files:[],budget:0,days:30};db.projects.unshift(p);pid=p.id;log('Projeto criado');go('Projetos')})}
function projects(){let p=project();return `<div class="row"><div><h1>Projetos e planta</h1><p class="sub">Selecione ambientes, faça upload da planta e posicione dispositivos.</p></div>${b('+ Novo projeto',"newProject()",'primary')}</div>${panel('Projetos',`<div class="stack">${db.projects.map(x=>b(esc(x.name)+(x.archived?' (arquivado)':''),`selectProject(${x.id})`,x.id===pid?'primary':'' )).join('')}</div>`)}<div class="grid two"><div>${panel('Dados do projeto',`<div class="listitem"><b>${esc(p.name)}</b> ${badge(p.status)}</div><p>Cliente: <b>${esc(p.client)}</b></p><p>Arquiteto: ${esc(p.architect)}</p><p>Técnico: ${esc(p.tech)}</p><p>Administrador: ${esc(p.admin)}</p><div class="stack">${b('Editar responsáveis',"editProject()")}${b(p.archived?'Reativar':'Arquivar',"archiveProject()")}</div>`)}${panel('Planta do projeto',`<input type="file" accept="image/*,.pdf" onchange="uploadFile(event,'planta')"><p class="muted">Imagens aparecem na planta. PDFs ficam disponíveis para abrir.</p>${p.files.map((f,i)=>`<div class="listitem row">${esc(f.name)} ${b('Visualizar',`showFile(${i})`,'small')}</div>`).join('')}`)}</div><div>${panel('Ambientes',`<div class="stack">${p.rooms.map(r=>b(esc(r),`pickRoom(${JSON.stringify(r)})`,r===selectedRoom?'primary':'' )).join('')}${b('+ Ambiente',"addRoom()")}</div><p class="muted">Ambiente selecionado: ${esc(selectedRoom)}</p><div class="stack">${b('Ver dispositivos',"go('Dispositivos')")}${b('Abrir inspeção',"go('Inspeções')")}</div>`)}${panel('Mapa interativo',floor())}</div></div>`}
function floor(){let p=project();let img=p.files.find(f=>f.kind==='planta'&&f.data.startsWith('data:image/'));return `<div class="row" style="margin-bottom:10px"><span class="muted">Arraste os pontos para mover</span><div class="stack">${b('−',"setZoom(-.2)",'small')}${b('+',"setZoom(.2)",'small')}${b('Redefinir',"zoom=1;render()",'small')}</div></div><div class="floor" id="floor"><div class="rooms" style="transform:scale(${zoom})">${img?`<img src="${img.data}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;opacity:.65">`:''}${p.rooms.slice(0,4).map(r=>`<div class="room ${selectedRoom===r?'active':''}" onclick="pickRoom(${JSON.stringify(r)})">${esc(r)}</div>`).join('')}${p.devices.map(d=>`<div class="device ${d.warn?'warn':''}" title="${esc(d.name)}" style="left:${d.x}%;top:${d.y}%" onpointerdown="dragStart(event,${d.id})" onclick="deviceInfo(${d.id})">●</div>`).join('')}</div></div>`}function setZoom(d){zoom=Math.max(.6,Math.min(2.2,zoom+d));render()}function pickRoom(r){selectedRoom=r;render()}function addRoom(){let r=prompt('Nome do ambiente:');if(r){project().rooms.push(r);log('Ambiente cadastrado: '+r);render()}}function archiveProject(){project().archived=!project().archived;log('Arquivamento de projeto alterado');render()}function editProject(){openForm('Responsáveis e cliente',[['client','Cliente',project().client],['architect','Arquiteto',project().architect],['tech','Técnico',project().tech],['admin','Administrador',project().admin]],d=>{Object.assign(project(),d);log('Responsáveis alterados');render()})}function showFile(i){let f=project().files[i];let w=window.open();if(w)w.document.write(`<title>${esc(f.name)}</title><iframe src="${f.data}" style="border:0;width:100%;height:100vh"></iframe>`);else toast('Permita janelas pop-up para visualizar')}
function uploadFile(e,kind){let file=e.target.files[0];if(!file)return;if(file.size>2200000)return toast('Limite de 2,2 MB por arquivo nesta demonstração');let r=new FileReader();r.onload=()=>{project().files.push({name:file.name,kind,data:r.result});log('Anexo enviado: '+file.name);render()};r.readAsDataURL(file)}
function devices(){let p=project();let list=catalog.filter(d=>(d.name+' '+d.category).toLowerCase().includes(filter.toLowerCase()));return `<h1>Catálogo de automação</h1><p class="sub">Pesquise dispositivos e adicione-os ao ambiente selecionado.</p>${panel('Pesquisar dispositivos',`<input placeholder="Pesquisar nome ou categoria" value="${esc(filter)}" oninput="filter=this.value;renderKeepFocus()">`)}<div class="grid">${list.map((d,i)=>`<div class="card"><span class="pill">${d.category}</span><h3 style="margin-top:14px">${d.name}</h3><p class="muted">${d.watts} W • R$ ${d.cost.toLocaleString('pt-BR')}</p><div class="stack">${b('Especificações',`spec(${catalog.indexOf(d)})`,'small')}${b('Adicionar à planta',`addDevice(${catalog.indexOf(d)})`,'small primary')}</div></div>`).join('')}</div>${panel('Dispositivos do projeto',p.devices.length?p.devices.map(d=>`<div class="listitem row"><div><b>${esc(d.name)}</b><p class="muted">${esc(d.room)} • ${d.watts} W</p></div><div class="stack">${b('Substituir',`replaceDevice(${d.id})`,'small')}${b('Remover',`removeDevice(${d.id})`,'small danger')}</div></div>`).join(''):'<div class="empty">Nenhum dispositivo adicionado.</div>')}${panel('Posicionamento na planta',floor())}`}
function renderKeepFocus(){let el=document.activeElement;let pos=el.selectionStart;render();let n=document.querySelector('input[placeholder="Pesquisar nome ou categoria"]');if(n){n.focus();n.setSelectionRange(pos,pos)}}function spec(i){let d=catalog[i];openModal(`<h2>${esc(d.name)}</h2><p>Categoria: ${d.category}</p><p>Potência estimada: ${d.watts} W</p><p>Preço ilustrativo: R$ ${d.cost}</p><p class="muted">Verifique disponibilidade, rede elétrica e protocolos antes da instalação.</p>${b('Adicionar',`addDevice(${i});closeModal()`,'primary')}`)}function addDevice(i){let d=catalog[i];let warn=d.category==='Climatização'&&!project().devices.some(x=>x.category==='Rede');let item={...d,id:Date.now(),room:selectedRoom,x:15+Math.random()*65,y:15+Math.random()*60,warn};project().devices.push(item);if(warn)notify('Possível incompatibilidade: avalie hub de rede para '+d.name);log('Dispositivo inserido: '+d.name);render();toast(warn?'Dispositivo adicionado: confira compatibilidade':'Dispositivo adicionado à planta')}function removeDevice(id){project().devices=project().devices.filter(x=>x.id!==id);log('Dispositivo removido');render()}function replaceDevice(id){let name=prompt('Substituir por (digite nome de dispositivo do catálogo):',catalog[0].name);let d=catalog.find(x=>x.name.toLowerCase()===name?.toLowerCase());if(!d)return toast('Dispositivo não encontrado');Object.assign(project().devices.find(x=>x.id===id),d);log('Dispositivo substituído');render()}function deviceInfo(id){let d=project().devices.find(x=>x.id===id);if(d)toast(d.name+' • '+d.room)}let dragging=null;function dragStart(e,id){dragging=id;e.target.setPointerCapture(e.pointerId);e.target.onpointermove=ev=>{if(dragging!==id)return;let box=document.querySelector('.rooms').getBoundingClientRect(),d=project().devices.find(x=>x.id===id);d.x=Math.max(0,Math.min(95,(ev.clientX-box.left)/box.width*100));d.y=Math.max(0,Math.min(90,(ev.clientY-box.top)/box.height*100));e.target.style.left=d.x+'%';e.target.style.top=d.y+'%'};e.target.onpointerup=()=>{dragging=null;log('Dispositivo movido na planta')}}
function simulation(){let p=project(),w=p.devices.reduce((a,d)=>a+d.watts,0),cost=p.devices.reduce((a,d)=>a+d.cost,0),kwh=w*5*30/1000;return `<h1>Simulações e viabilidade</h1><p class="sub">Estimativas ilustrativas para apoiar a tomada de decisão.</p><div class="grid">${stat('Potência total',w+' W')}${stat('Consumo mensal (5h/dia)',kwh.toFixed(1)+' kWh')}${stat('Custo dos dispositivos','R$ '+cost.toLocaleString('pt-BR'))}</div>${panel('Configuração atual',`<p>${p.devices.length} dispositivo(s) • Prazo estimado: ${p.days} dias • Custo de instalação: R$ ${Number(p.budget).toLocaleString('pt-BR')}</p><p>Economia potencial demonstrativa: ${Math.round(kwh*.15)} kWh/mês (hipótese de 15%).</p><div class="stack">${b('Salvar simulação',"saveSimulation()",'primary')}${b('Enviar à análise técnica',"sendAnalysis()")}${b('Exportar CSV',"exportCSV('simulacao')")}</div>`)}${panel('Comparar configurações',p.simulation.length?`<div class="stack">${p.simulation.map((s,i)=>b('Simulação '+(i+1),`compareSimulation(${i})`)).join('')}</div>${simA!==null?`<p class="notice">Comparação: configuração salva com ${p.simulation[simA].devices} dispositivos e R$ ${p.simulation[simA].cost} vs. atual com ${p.devices.length} dispositivos e R$ ${cost}.</p>`:''}`:'<p class="muted">Salve uma simulação para comparar com futuras configurações.</p>')}`}
function saveSimulation(){let p=project();p.simulation.push({time:now(),devices:p.devices.length,cost:p.devices.reduce((a,d)=>a+d.cost,0),watts:p.devices.reduce((a,d)=>a+d.watts,0)});log('Simulação gerada');render()}function compareSimulation(i){simA=i;render()}function sendAnalysis(){project().status='Aguardando parecer técnico';notify('Projeto encaminhado ao administrador e técnico para análise');log('Projeto enviado para análise');render()}
function inspections(){let p=project();return `<h1>Inspeções e parecer técnico</h1><p class="sub">Agende visitas, registre resultados por ambiente e envie pareceres.</p>${panel('Agendar inspeção',`<form onsubmit="addInspection(event)"><div class="grid two">${field('date','Data da visita','','date')}${field('time','Horário','','time')}</div><div class="field"><label>Ambiente</label><select name="room">${p.rooms.map(r=>`<option>${esc(r)}</option>`).join('')}</select></div><div class="field"><label>Observações e roteiro</label><textarea name="note" placeholder="Verificar infraestrutura, pontos elétricos, rede e viabilidade"></textarea></div><button class="btn primary">Agendar e registrar</button></form>`)}${panel('Roteiro de inspeção',`<p>☐ Conferir infraestrutura elétrica e quadro de distribuição</p><p>☐ Avaliar conectividade e cobertura de rede</p><p>☐ Verificar posição e compatibilidade dos dispositivos</p><p>☐ Fotografar pontos críticos e registrar riscos</p><p>☐ Validar orçamento, cronograma e pendências</p>`)}${panel('Registros e pareceres',p.inspections.map((x,i)=>`<div class="listitem"><div class="row"><b>${esc(x.room)} • ${esc(x.date)} ${esc(x.time)}</b>${badge(x.status||'Agendada')}</div><p>${esc(x.note)}</p><div class="stack">${b('Registrar parecer',`inspectionOpinion(${i})`,'small')}${b('Responder',`inspectionReply(${i})`,'small')}${b('Anexar arquivo',`attachInspection(${i})`,'small')}</div>${x.opinion?`<p class="notice">Parecer: ${esc(x.opinion)} ${x.reply?'• Resposta: '+esc(x.reply):''}</p>`:''}</div>`).join('')||'<p class="muted">Nenhuma inspeção agendada.</p>')}`}
function addInspection(e){e.preventDefault();project().inspections.push({...formData(e.target),status:'Agendada'});notify('Inspeção técnica agendada');log('Inspeção agendada');render()}function inspectionOpinion(i){let x=project().inspections[i],t=prompt('Parecer técnico (riscos, incompatibilidades, custos e prazos):');if(t){x.opinion=t;x.status='Parecer emitido';notify('Novo parecer técnico enviado ao arquiteto');log('Parecer técnico emitido');render()}}function inspectionReply(i){let x=project().inspections[i],t=prompt('Resposta do arquiteto:');if(t){x.reply=t;log('Arquiteto respondeu ao parecer');render()}}function attachInspection(i){let t=prompt('Nome ou descrição do anexo da inspeção:');if(t){project().inspections[i].note+=' | Anexo: '+t;log('Anexo de inspeção registrado');render()}}
function versions(){let p=project();return `<h1>Revisões e versões</h1><p class="sub">Registre alterações e solicite novas análises.</p>${panel('Nova revisão',`<div class="field"><label>Descrição da alteração</label><textarea id="revision" placeholder="Ex.: Mover interruptor para coluna Y"></textarea></div><div class="stack">${b('Confirmar nova versão',"addVersion()",'primary')}${b('Solicitar nova análise',"requestAnalysis()")}${b('Solicitar inspeção',"go('Inspeções')")}</div>`)}${panel('Histórico de versões',p.versions.map((v,i)=>`<div class="listitem row"><div><b>Versão ${v.n}</b><p class="muted">${esc(v.at)} • ${esc(v.time)}</p></div>${i>0?b('Comparar anterior',`compareVersion(${i})`,'small'):''}</div>`).join(''))}`}
function addVersion(){let t=document.getElementById('revision').value.trim();if(!t)return toast('Descreva a alteração');let p=project();p.versions.push({n:p.versions.length+1,at:t,time:now()});p.status='Revisão pendente';notify('Nova versão do projeto enviada aos responsáveis');log('Nova versão criada: '+t);render()}function compareVersion(i){let a=project().versions;openModal(`<h2>Comparação de versões</h2><p><b>Anterior:</b> ${esc(a[i-1].at)}</p><p><b>Atual:</b> ${esc(a[i].at)}</p><p class="muted">Diferenças textuais registradas. Comparação geométrica de plantas exige motor CAD/BIM.</p>`)}function requestAnalysis(){notify('Nova análise ou inspeção solicitada');project().status='Em análise';log('Nova análise solicitada');render()}
function execution(){let p=project();return `<h1>Execução da obra</h1><p class="sub">Planeje etapas, registre instalações e acompanhe custos e pendências.</p>${panel('Controle da execução',`<div class="stack">${b('Aprovar e liberar execução',"approveExecution()",'primary')}${b('Adicionar etapa',"addStep()")}${b('Atualizar orçamento e prazo',"updateBudget()")}${b('Encerrar projeto',"finishProject()")}</div><p>Status atual: ${badge(p.status)}</p>`)}${panel('Etapas da obra',p.steps.map((x,i)=>`<div class="listitem row"><div><b>${esc(x.name)}</b><p class="muted">${esc(x.room)} • ${esc(x.note||'Sem ocorrências')}</p></div><div class="stack">${badge(x.status)}${b('Atualizar',`updateStep(${i})`,'small')}</div></div>`).join('')||'<p class="muted">Nenhuma etapa cadastrada.</p>')}${panel('Indicadores',`<p>Orçamento: R$ ${Number(p.budget).toLocaleString('pt-BR')} • Prazo: ${p.days} dias</p><p>Etapas concluídas: ${p.steps.filter(x=>x.status==='Concluído').length} de ${p.steps.length}</p><p>Dispositivos cadastrados: ${p.devices.length}</p>`)}`}
function approveExecution(){project().status='Aprovado para execução';notify('Projeto aprovado para execução');log('Projeto liberado para execução');render()}function addStep(){openForm('Nova etapa',[['name','Nome da etapa'],['room','Ambiente',selectedRoom],['note','Observações']],d=>{project().steps.push({...d,status:'Pendente'});log('Etapa criada');render()})}function updateStep(i){let x=project().steps[i];openForm('Atualizar etapa',[['status','Status (Pendente, Em andamento, Concluído)',x.status],['note','Dispositivos instalados / ocorrências',x.note]],d=>{Object.assign(x,d);log('Andamento atualizado');render()})}function updateBudget(){openForm('Custos e prazos',[['budget','Orçamento (R$)',project().budget],['days','Prazo em dias',project().days]],d=>{project().budget=Number(d.budget);project().days=Number(d.days);log('Custos e prazos atualizados');render()})}function finishProject(){if(!confirm('Encerrar projeto?'))return;project().status='Concluído';log('Projeto encerrado');notify('Projeto concluído');render()}
function messages(){let p=project();return `<h1>Comunicação interna</h1><p class="sub">Mensagens e histórico vinculados ao projeto, ambientes e dispositivos.</p>${panel('Nova mensagem',`<form onsubmit="sendMessage(event)"><div class="field"><label>Ambiente ou dispositivo</label><select name="room"><option>Geral</option>${p.rooms.map(x=>`<option>${esc(x)}</option>`).join('')}${p.devices.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Mensagem (use @ para mencionar)</label><textarea name="text" required></textarea></div><button class="btn primary">Enviar mensagem</button></form>`)}${panel('Histórico',p.messages.slice().reverse().map(x=>`<div class="listitem"><div class="row"><b>${esc(x.by)}</b><span class="muted">${esc(x.time)}</span></div><span class="pill">${esc(x.room)}</span><p>${esc(x.text)}</p></div>`).join('')||'<p class="muted">Nenhuma mensagem enviada.</p>')}`}
function sendMessage(e){e.preventDefault();let d=formData(e.target);project().messages.push({...d,by:user().name,time:now()});if(d.text.includes('@'))notify('Você foi mencionado em uma conversa do projeto');log('Mensagem enviada');render()}
function notifications(){return `<h1>Central de notificações</h1><p class="sub">Acompanhe alertas de prazo, segurança, custo e alterações.</p>${panel('Notificações',`<div class="stack">${b('Marcar todas como lidas',"readAll()")}</div>${db.notifications.map((n,i)=>`<div class="listitem row"><div>${n.read?'':'🔵 '}<b>${esc(n.msg)}</b><p class="muted">${esc(n.time)}</p></div>${!n.read?b('Marcar lida',`readOne(${i})`,'small'):badge('Lida')}</div>`).join('')||'<p class="muted">Nenhuma notificação.</p>'}`)}`}
function readAll(){db.notifications.forEach(n=>n.read=true);save();render()}function readOne(i){db.notifications[i].read=true;save();render()}
function commercial(){return `<h1>Clientes e oportunidades</h1><p class="sub">Acompanhe contatos, propostas e vínculo com arquitetos.</p>${panel('Ações',`<div class="stack">${b('+ Cadastrar cliente',"newClient()",'primary')}${b('Novo contato',"go('Contato')")}</div>`)}${panel('Clientes',db.clients.map((c,i)=>`<div class="listitem row"><div><b>${esc(c.name)}</b><p class="muted">${esc(c.email)} • Arquiteto: ${esc(c.architect)}</p></div><div class="stack">${badge(c.stage)}${b('Editar',`editClient(${i})`,'small')}</div></div>`).join(''))}${panel('Contatos recebidos',db.contacts.map(c=>`<div class="listitem"><b>${esc(c.name)}</b> • ${esc(c.email)}<p>${esc(c.message)}</p></div>`).join('')||'<p class="muted">Nenhum contato recebido.</p>')}`}
function newClient(){openForm('Cadastrar cliente',[['name','Nome'],['email','E-mail'],['architect','Arquiteto responsável'],['stage','Etapa comercial']],d=>{db.clients.push({id:Date.now(),...d});log('Cliente cadastrado');render()})}function editClient(i){let c=db.clients[i];openForm('Editar cliente',[['name','Nome',c.name],['email','E-mail',c.email],['architect','Arquiteto responsável',c.architect],['stage','Etapa comercial',c.stage]],d=>{Object.assign(c,d);log('Cliente atualizado');render()})}
function users(){return `<h1>Usuários e permissões</h1><p class="sub">Gerencie contas e perfis. Acesso demonstrativo, sem autenticação de produção.</p>${panel('Novo usuário',b('Cadastrar usuário',"newUser()",'primary'))}${panel('Contas cadastradas',`<table class="table"><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Ações</th></tr>${db.users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${badge(u.role)}</td><td>${b('Editar',`editUser(${i})`,'small')}</td></tr>`).join('')}</table>`)}${panel('Regras de acesso',`<p><b>Administrador:</b> gestão completa, aprovação e auditoria.</p><p><b>Arquiteto:</b> criação, revisão, dispositivos e acompanhamento.</p><p><b>Técnico:</b> inspeção, parecer e execução.</p><p><b>Cliente:</b> acompanhamento e comunicação.</p><p class="notice">As regras acima são ilustrativas. Permissões reais precisam ser validadas em servidor.</p>`)}`}
function newUser(){openForm('Cadastrar usuário',[['name','Nome'],['email','E-mail'],['password','Senha'],['role','Perfil']],d=>{db.users.push({id:Date.now(),...d});log('Usuário cadastrado');render()})}function editUser(i){let u=db.users[i];openForm('Editar usuário',[['name','Nome',u.name],['email','E-mail',u.email],['role','Perfil',u.role]],d=>{Object.assign(u,d);log('Permissões atualizadas');render()})}
function audit(){return `<h1>Auditoria e relatórios</h1><p class="sub">Histórico de alterações, responsáveis, decisões e exportação.</p>${panel('Relatórios',`<div class="stack">${b('Exportar auditoria CSV',"exportCSV('audit')",'primary')}${b('Relatório PDF (impressão)',"window.print()")}${b('Exportar projeto CSV',"exportCSV('project')")}</div>`)}${panel('Linha do tempo do projeto',db.audit.filter(x=>x.project===project().name).map(x=>`<div class="listitem"><b>${esc(x.action)}</b><p class="muted">${esc(x.by)} • ${esc(x.time)}</p></div>`).join('')||'<p class="muted">Sem alterações registradas.</p>')}${panel('Registro de acessos e decisões',`<table class="table"><tr><th>Data</th><th>Responsável</th><th>Ação</th></tr>${db.audit.map(x=>`<tr><td>${esc(x.time)}</td><td>${esc(x.by)}</td><td>${esc(x.action)}</td></tr>`).join('')}</table>`)}`}
function exportCSV(type){let p=project(),rows=type==='audit'?[['Data','Responsável','Ação','Projeto'],...db.audit.map(x=>[x.time,x.by,x.action,x.project])]:type==='simulacao'?[['Projeto','Dispositivos','Potência (W)','Custo'],[p.name,p.devices.length,p.devices.reduce((a,x)=>a+x.watts,0),p.devices.reduce((a,x)=>a+x.cost,0)]]:[['Projeto','Cliente','Status','Ambiente','Dispositivo'],...p.devices.map(x=>[p.name,p.client,p.status,x.room,x.name])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='lobal_'+type+'.csv';a.click();URL.revokeObjectURL(a.href);log('Relatório exportado: '+type)}
function requirements(){return `<h1>Requisitos funcionais RF01–RF60</h1><p class="sub">Rastreabilidade entre os requisitos e as áreas do protótipo.</p>${MODULES.map(([name,start,end])=>panel(`${name} · RF${String(start).padStart(2,'0')}–RF${end}`,`<div class="stack" style="margin-bottom:14px">${b('Abrir módulo',`go('${name==='Início'?'Dashboard':name}')`,'small primary')}</div>${REQS.slice(start-1,end).map((r,i)=>`<div class="listitem"><span class="req">RF${String(start+i).padStart(2,'0')}</span> ${esc(r)}</div>`).join('')}`)).join('')}`}
function openModal(html){modal=html;render()}function closeModal(){modal=null;render()}function openForm(title,fields,cb){window.formCallback=cb;openModal(`<h2>${esc(title)}</h2><form onsubmit="submitGeneric(event)">${fields.map(f=>field(...f)).join('')}<div class="stack"><button class="btn primary">Salvar</button>${b('Cancelar',"closeModal()")}</div></form>`)}function submitGeneric(e){e.preventDefault();let d=formData(e.target);modal=null;window.formCallback(d);save();render()}
function render(){let root=document.getElementById('root');let content;if(page==='Início')content=home();else if(page==='Login')content=auth();else if(page==='Cadastro')content=auth(true);else if(page==='Contato')content=contact();else if(!user()){page='Login';content=auth()}else{let map={'Dashboard':dashboard,'Comercial':commercial,'Projetos':projects,'Dispositivos':devices,'Simulações':simulation,'Inspeções':inspections,'Versões':versions,'Execução':execution,'Mensagens':messages,'Notificações':notifications,'Auditoria':audit,'Usuários':users,'Requisitos':requirements};content=layout((map[page]||dashboard)())}root.innerHTML=content+(modal?`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${modal}</div></div>`:'');save()};render();
</script></body></html>
